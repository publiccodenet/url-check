<svg xmlns="http://www.w3.org/2000/svg" width="192" height="20" role="img" aria-label="link check: demo-bad-link failing">
  <title>link check: demo-bad-link failing</title>
  <filter id="blur">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="192" height="20" rx="3"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="65" height="20" fill="#555"/>
    <rect x="65" width="127" height="20" fill="#dd4343"/>
    <rect width="192" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <g transform="scale(.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="335" y="150" fill-opacity=".8" filter="url(#blur)" textLength="550">link check</text>
        <text x="335" y="150" fill-opacity=".3" textLength="550">link check</text>
      </g>
      <text x="335" y="140" textLength="550">link check</text>
    </g>
    <g transform="scale(.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="1275" y="150" fill-opacity=".8" filter="url(#blur)" textLength="1170">demo-bad-link failing</text>
        <text x="1275" y="150" fill-opacity=".3" textLength="1170">demo-bad-link failing</text>
      </g>
      <text x="1275" y="140" textLength="1170">demo-bad-link failing</text>
    </g>
  </g>
</svg>
